---
# Base URLs of the Dell Linux repository, without the trailing /hardware/. dnf
# tries them in order and falls over to the next one when a download fails, so
# Dell comes first and the mirrors cover its frequent outages. Every entry must
# host dell_repo_version, or a run during a Dell outage fails. Override per
# cluster in group_vars to put a nearer or faster mirror first.
dell_repo_base_urls:
  - https://linux.dell.com/repo
  - https://ftp.gwdg.de/pub/linux/dell/repo
  - https://mirror.chpc.utah.edu/pub/linux.dell.com/repo
