---
# Opens a pull request when Dell publishes a new DSU release on linux.dell.com.
#
# The detect job runs Dell's iSM installer (bin/dell-ism-versions.sh), so it
# gets a read-only token and no persisted git credentials. The pull-request
# job only edits vars/main.yml and opens the pull request. The scripts in bin/
# also run outside GitHub Actions.
name: dell-update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # Dry run (detect only) for changes to the workflow or its scripts.
  pull_request:
    paths:
      - .github/workflows/dell-update.yml
      - bin/dell-*

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      update: ${{ steps.release.outputs.update }}
      dell_repo_version: ${{ steps.release.outputs.dell_repo_version }}
      ism_version: ${{ steps.release.outputs.ism_version }}
      systems_management_version: ${{ steps.release.outputs.systems_management_version }}
      dcism_version: ${{ steps.ism.outputs.dcism_version }}
      dcism_osc_version: ${{ steps.ism.outputs.dcism_osc_version }}
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Find the latest Dell release
        id: release
        run: bin/dell-latest-release.py >>"$GITHUB_OUTPUT"

      - name: Install rpm2cpio and cpio
        if: steps.release.outputs.update == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm2cpio cpio >/dev/null

      - name: Read the dcism versions from the iSM installer
        id: ism
        if: steps.release.outputs.update == 'true'
        env:
          ISM_URL: ${{ steps.release.outputs.ism_url }}
          ISM_CHECKSUM_TYPE: ${{ steps.release.outputs.ism_checksum_type }}
          ISM_CHECKSUM: ${{ steps.release.outputs.ism_checksum }}
          ISM_NAME: ${{ steps.release.outputs.ism_name }}
        run: bin/dell-ism-versions.sh "$ISM_URL" "$ISM_CHECKSUM_TYPE" "$ISM_CHECKSUM" "$ISM_NAME" >>"$GITHUB_OUTPUT"

  pull-request:
    needs: detect
    if: needs.detect.outputs.update == 'true' && github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@v7.0.1

      - name: Update vars/main.yml
        env:
          DELL_REPO_VERSION: ${{ needs.detect.outputs.dell_repo_version }}
          SYSTEMS_MANAGEMENT_VERSION: ${{ needs.detect.outputs.systems_management_version }}
          DCISM_VERSION: ${{ needs.detect.outputs.dcism_version }}
          DCISM_OSC_VERSION: ${{ needs.detect.outputs.dcism_osc_version }}
        run: >-
          bin/dell-update-vars.py
          --dell-repo-version "$DELL_REPO_VERSION"
          --systems-management-version "$SYSTEMS_MANAGEMENT_VERSION"
          --dcism-version "$DCISM_VERSION"
          --dcism-osc-version "$DCISM_OSC_VERSION"

      - name: Open pull request
        # https://github.com/peter-evans/create-pull-request/releases
        # Pinned to a commit: this step runs with a token that can write.
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: dell-update
          delete-branch: true
          commit-message: Update Dell repository to ${{ needs.detect.outputs.dell_repo_version }} and iSM to ${{ needs.detect.outputs.ism_version }}
          title: Update Dell repository to ${{ needs.detect.outputs.dell_repo_version }} and iSM to ${{ needs.detect.outputs.ism_version }}
          body: |
            Dell published [${{ needs.detect.outputs.dell_repo_version }}](https://linux.dell.com/repo/hardware/${{ needs.detect.outputs.dell_repo_version }}/). The newest iSM installer in it is `${{ needs.detect.outputs.systems_management_version }}`, with `dcism-${{ needs.detect.outputs.dcism_version }}` and `dcism-osc-${{ needs.detect.outputs.dcism_osc_version }}`; its Dell signature was verified before they were read.

            Hosts fall back to the mirrors in their inventory's `dell_repo_base_urls` only once those mirrors carry the release.

            This pull request was opened with the workflow token, so the pre-commit checks do not start on their own: close and reopen it to run them. Test the upgrade on one host before rolling it out.
