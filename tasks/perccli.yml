---
# The Dell OS independent repository ships perccli, signed with the same key as
# dell-system-update (0x1285491434D8786F), so no separate download from
# dl.dell.com is needed.
- name: Install perccli
  ansible.builtin.dnf:
    name: perccli
    state: present

- name: Link perccli
  ansible.builtin.file:
    src: /opt/MegaRAID/perccli/perccli64
    dest: /usr/bin/perccli
    owner: root
    group: root
    state: link
