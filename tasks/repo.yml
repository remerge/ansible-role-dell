---
- name: Download Dell repository certificate
  ansible.builtin.get_url:
    url: https://cacerts.digicert.com/DigiCertGlobalG2TLSRSASHA2562020CA1-1.crt.pem
    dest: /etc/pki/ca-trust/source/anchors
    owner: root
    group: root
    mode: "0644"
  notify: Update CA Trust

- name: Run handlers if necessary
  ansible.builtin.meta: flush_handlers

- name: Add Dell OS independent repository
  ansible.builtin.yum_repository:
    file: dell-system-update
    name: dell-system-update_independent
    description: Dell OS independent
    baseurl: "{{ dell_repo_base_url }}/hardware/{{ dell_repo_version }}/os_independent/"
    gpgcheck: true
    exclude: dell-system-update*.i386

- name: Add Dell OS dependent repository
  ansible.builtin.yum_repository:
    file: dell-system-update
    name: dell-system-update_dependent
    description: Dell OS dependent
    baseurl: "{{ dell_repo_base_url }}/hardware/{{ dell_repo_version }}/os_dependent/RHEL9_64/"
    gpgcheck: true

- name: Create /usr/libexec/dell_dup
  ansible.builtin.file:
    path: /usr/libexec/dell_dup
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Dell GPG key files
  ansible.builtin.package:
    name: distribution-gpg-keys
    state: present

# The GWDG mirror does not host Dell's pgp_pubkeys/, and distribution-gpg-keys
# only drops the key files on disk without importing them. Import them into the
# RPM keyring here so the gpgcheck-enabled Dell repos can verify packages
# without depending on linux.dell.com being reachable at provision time.
- name: Find Dell GPG key files
  ansible.builtin.find:
    paths: /usr/share/distribution-gpg-keys/dell
    patterns:
      - "*.asc"
      - "*.key"
    # The BDC Hypervisor Engineering key carries SHA1 self-signatures, which
    # the DEFAULT crypto policy on EL9 rejects on import. It only signs Dell's
    # hypervisor/BDC packages, not the DSU repos used here (dell-system-update
    # is signed with 0x1285491434D8786F, firmware DUPs with 0x076B95DB2FFC7F4A).
    excludes:
      - 0x274E9C32857A9594.asc
  register: dell_gpg_key_files

- name: Import Dell GPG keys
  ansible.builtin.rpm_key:
    key: "{{ item.path }}"
    state: present
  loop: "{{ dell_gpg_key_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# Hosts provisioned under the LEGACY crypto policy imported the SHA1 key
# excluded above back when that still worked; drop it from the RPM keyring.
- name: Remove legacy Dell GPG key with SHA1 self-signatures
  ansible.builtin.rpm_key:
    key: 857a9594
    state: absent
